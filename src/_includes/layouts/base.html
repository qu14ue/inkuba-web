<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or site.nombre }}</title>
  {% if description %}<meta name="description" content="{{ description }}" />{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body class="{{ bodyClass }}">
  {% include "partials/header.html" %}
  <main>
    {{ content | safe }}
  </main>
  {% include "partials/footer.html" %}
  <div class="lightbox" data-lightbox aria-hidden="true">
    <button class="lightbox-close" data-lightbox-close aria-label="Cerrar">&times;</button>
    <div class="lightbox-body" data-lightbox-body></div>
  </div>
  <script src="/assets/js/menu.js" defer></script>
  <script src="/assets/js/carousel.js" defer></script>
  <script src="/assets/js/compare-slider.js" defer></script>
  <script src="/assets/js/stepper.js" defer></script>
  <script src="/assets/js/faq.js" defer></script>
  <script src="/assets/js/filters.js" defer></script>
  <script src="/assets/js/lightbox.js" defer></script>
  <script src="/assets/js/video-grid.js" defer></script>
</body>
</html>
